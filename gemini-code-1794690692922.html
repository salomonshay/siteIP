<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>What is my IP?</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        #ip { font-size: 2rem; color: #0066cc; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Your IP Address Is:</h1>
        <div id="ip">Loading...</div>
    </div>

    <script>
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('ip').innerText = data.ip;
            })
            .catch(error => {
                document.getElementById('ip').innerText = 'Unable to retrieve IP';
            });
    </script>
</body>
</html>
